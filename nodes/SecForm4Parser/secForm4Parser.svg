<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" fill="none">
  <!-- Document body with dog-ear -->
  <path d="M9 4 L39 4 L39 14 L51 14 L51 56 L9 56 Z" stroke="#1e293b" stroke-width="2.5" stroke-linejoin="round" fill="#f1f5f9"/>
  <!-- Dog-ear fold -->
  <path d="M39 4 L51 14" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Candlestick 1 — down -->
  <line x1="18" y1="25" x2="18" y2="29" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <rect x="15" y="29" width="6" height="11" rx="0.8" fill="#1e293b"/>
  <line x1="18" y1="40" x2="18" y2="44" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <!-- Candlestick 2 — up (taller) -->
  <line x1="30" y1="18" x2="30" y2="22" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <rect x="27" y="22" width="6" height="14" rx="0.8" fill="#1e293b"/>
  <line x1="30" y1="36" x2="30" y2="40" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <!-- Candlestick 3 — down (short) -->
  <line x1="42" y1="27" x2="42" y2="31" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
  <rect x="39" y="31" width="6" height="9" rx="0.8" fill="#1e293b"/>
  <line x1="42" y1="40" x2="42" y2="44" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
</svg>

